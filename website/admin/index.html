<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0e0b1b">
  <meta name="robots" content="noindex, nofollow">
  <title>Spectra admin</title>
  <link rel="icon" href="/img/logo-512.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/site.css">
  <style>
    body { font-size: 15px; }
    .admin { display: grid; grid-template-columns: 210px 1fr; gap: 32px; padding: 32px 0 80px; }
    @media (max-width: 860px) { .admin { grid-template-columns: 1fr; } }
    .tabs { display: flex; flex-direction: column; gap: 2px; position: sticky; top: 88px; align-self: start; }
    .tabs button { all: unset; cursor: pointer; padding: 9px 12px; border-radius: 5px; font-weight: 600; }
    .tabs button:hover { background: var(--surface-2); }
    .tabs button[aria-selected="true"] { background: var(--grad); color: #fff; }
    .pane { display: none; } .pane.on { display: block; }
    .pane h2 { font-size: 26px; margin: 0 0 6px; letter-spacing: -.02em; }
    .pane > p { color: var(--muted); margin: 0 0 22px; max-width: 46em; }
    .f { display: grid; gap: 6px; margin: 0 0 16px; }
    .f > span { font: 600 12px var(--mono); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
    input[type=text], input[type=password], input[type=url], textarea, select {
      font: inherit; width: 100%; padding: 10px 12px; border: 1px solid var(--rule-2); border-radius: 8px; background: var(--surface-2); color: var(--text);
    }
    textarea { font: 13px/1.5 var(--mono); min-height: 120px; resize: vertical; }
    textarea.code { min-height: 220px; }
    textarea.raw { min-height: 60vh; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
    .grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0 12px; }
    @media (max-width: 700px) { .grid2, .grid4 { grid-template-columns: 1fr; } }
    .item { border: 1px solid var(--rule-2); border-radius: 12px; padding: 16px; margin: 0 0 14px; background: var(--surface); }
    .item-head { display: flex; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .item-head strong { font-size: 16px; }
    .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .chk { display: inline-flex; gap: 6px; align-items: center; font-size: 14px; margin-right: 12px; }
    .thumb { width: 96px; height: 60px; object-fit: cover; border: 1px solid var(--rule-2); border-radius: 6px; background: var(--surface-2); flex: none; }
    .mpicker { max-height: 420px; overflow: auto; margin-top: 10px; border-top: 1px solid var(--rule-2); }
    .mpick { display: flex; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--rule-2); }
    .mpick .grow { flex: 1; min-width: 0; }
    .item details { border: 0; padding: 0; } .item summary { font-size: 13px; font-weight: 600; padding: 8px 0; }
    .savebar { position: sticky; bottom: 0; background: rgba(14,11,27,.92); backdrop-filter: blur(10px); border-top: 1px solid var(--rule-2); padding: 12px 0; z-index: 10; }
    .savebar .wrap { display: flex; gap: 14px; align-items: center; justify-content: space-between; }
    #status { font: 13px var(--mono); }
    #status.err { color: #ff8a8a; } #status.ok { color: var(--teal); }
    .login { max-width: 420px; margin: 80px auto; }
    .danger { box-shadow: inset 0 0 0 1.5px #ff6b6b; color: #ff9b9b; }
    .small-note { font-size: 13px; color: var(--muted); margin: -6px 0 14px; }
  </style>
</head>
<body>
  <header class="top">
    <div class="wrap">
      <a class="wordmark" href="/" aria-label="Spectra home">
        <img src="/img/logo-512.png" alt="" width="30" height="30">
        spectra <span class="label" style="margin-left:6px">admin</span>
      </a>
      <nav><a href="#" id="logout" hidden>Log out</a></nav>
    </div>
  </header>

  <div class="wrap">
    <form class="login" id="login">
      <h1 style="font-size:32px;letter-spacing:-.02em">Admin</h1>
      <p class="muted">Enter the <code>ADMIN_TOKEN</code> you set in Vercel. It's kept only for this browser tab.</p>
      <label class="f"><span>Admin token</span><input type="password" id="token" autocomplete="current-password" required></label>
      <button class="btn" type="submit">Open</button>
      <p id="login-err" class="muted" style="color:#b3261e"></p>
    </form>

    <div class="admin" id="admin" hidden>
      <div class="tabs" role="tablist">
        <button role="tab" data-t="general" aria-selected="true">General</button>
        <button role="tab" data-t="featured">Featured</button>
        <button role="tab" data-t="hotfixes">CSS hotfixes</button>
        <button role="tab" data-t="classmap">Class map</button>
        <button role="tab" data-t="scripts">Scripts</button>
        <button role="tab" data-t="blocked">Blocked</button>
        <button role="tab" data-t="changelog">Changelog</button>
        <button role="tab" data-t="raw">Raw JSON</button>
      </div>
      <div id="panes"></div>
    </div>
  </div>

  <div class="savebar" id="savebar" hidden>
    <div class="wrap">
      <span id="status"></span>
      <div class="row">
        <button class="btn light small" id="revert">Discard changes</button>
        <button class="btn small" id="save">Save &amp; publish</button>
      </div>
    </div>
  </div>

  <script src="/js/admin.js"></script>
</body>
</html>
