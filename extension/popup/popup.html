<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Spectra</title>
  <style>
    :root { color-scheme: dark; --bg: #0f0f12; --surface: #16161a; --surface-2: #1c1c21; --border: rgba(255,255,255,.07); --border-strong: rgba(255,255,255,.13); --text: #ececef; --text-2: #a4a4ae; --text-3: #6f6f7a; --accent: #8b7cf6; --live: #3ccf86; }
    * { box-sizing: border-box; }
    body { margin: 0; width: 300px; background: var(--bg); color: var(--text); font: 13px/1.45 "Inter", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; }
    header { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--border); }
    header img { border-radius: 6px; }
    header b { font-size: 14px; font-weight: 700; }
    header small { display: flex; align-items: center; gap: 6px; color: var(--text-2); font-size: 11.5px; }
    header small::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--live); }
    header.off small::before { background: var(--text-3); }
    .switch { appearance: none; width: 32px; height: 18px; border-radius: 999px; background: #3a3a44; position: relative; cursor: pointer; transition: background .14s; margin: 0 0 0 auto; flex: none; }
    .switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: transform .14s; }
    .switch:checked { background: var(--accent); }
    .switch:checked::after { transform: translateX(14px); }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    main { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 12px; }
    .theme { display: flex; gap: 11px; align-items: center; }
    .theme .art { width: 64px; aspect-ratio: 16 / 10; border-radius: 5px; background: var(--surface-2); object-fit: cover; object-position: top left; flex: none; box-shadow: 0 0 0 1px var(--border); }
    .theme .name { font-weight: 600; }
    .theme .sub { color: var(--text-2); font-size: 12px; }
    label.k { color: var(--text-3); font-size: 11.5px; display: block; margin-bottom: 5px; }
    .chips { display: flex; gap: 5px; flex-wrap: wrap; }
    .chip { all: unset; cursor: pointer; height: 24px; padding: 0 9px; border-radius: 5px; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--border); font-size: 12px; color: var(--text-2); display: inline-flex; align-items: center; }
    .chip:hover { color: var(--text); }
    .chip.on { color: var(--text); box-shadow: inset 0 0 0 1.5px var(--accent); }
    .facts { margin: 0; border-top: 1px solid var(--border); padding-top: 10px; display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: 12.5px; }
    .facts dt { color: var(--text-2); }
    .facts dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
    .row { display: flex; gap: 6px; }
    button.btn { all: unset; flex: 1; text-align: center; cursor: pointer; height: 30px; line-height: 30px; border-radius: 7px; font-weight: 600; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--border-strong); transition: background .14s; }
    button.btn:hover { background: #212127; }
    button.btn.primary { background: var(--accent); box-shadow: none; color: #fff; }
    button.btn.primary:hover { background: #9d90f8; }
  </style>
</head>
<body>
  <header id="head">
    <img src="../icons/icon-32.png" width="24" height="24" alt="">
    <div><b>Spectra</b><small id="status">Active on open.spotify.com</small></div>
    <input type="checkbox" class="switch" id="master" aria-label="Turn Spectra on or off">
  </header>
  <main>
    <div class="theme">
      <img class="art" id="art" alt="" referrerpolicy="no-referrer">
      <div><div class="name" id="theme-name">Stock Spotify</div><div class="sub" id="theme-sub">No theme yet</div></div>
    </div>
    <div id="schemes-wrap" hidden><label class="k">Colour scheme</label><div class="chips" id="schemes"></div></div>
    <dl class="facts">
      <dt>Extensions on</dt><dd id="n-ext">0</dd>
      <dt>Snippets on</dt><dd id="n-snip">0</dd>
      <dt>Custom CSS</dt><dd><span id="n-css">0</span> lines</dd>
    </dl>
    <div class="row">
      <button class="btn primary" id="open">Open Spectra</button>
      <button class="btn" id="spotify">Go to Spotify</button>
    </div>
  </main>
  <script src="../shared/core.js"></script>
  <script src="popup.js"></script>
</body>
</html>
